<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="900" viewBox="0 0 1000 900" font-family="Microsoft YaHei, Segoe UI, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c2c8d2"/>
    </marker>
    <marker id="arrBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6ea8ff"/>
    </marker>
    <marker id="arrRelease" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8b909a"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#000000" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect width="1000" height="900" fill="#0e1116"/>
  <text x="36" y="44" font-size="24" font-weight="600" fill="#e7ebf1">dsh-status-lamp state machine</text>
  <text x="36" y="70" font-size="13" fill="#9aa1ac">Three plugin lamps layered on DSH's native states; conditions sit on the edges, no crossings.</text>

  <!-- native panel -->
  <rect x="330" y="80" width="340" height="170" rx="16" fill="#151a22" stroke="#2a313c" filter="url(#shadow)"/>
  <path d="M 346 80 H 654 A 16 16 0 0 1 670 96 V 112 H 330 V 96 A 16 16 0 0 1 346 80 Z" fill="#16233a"/>
  <text x="350" y="104" font-size="14" font-weight="600" fill="#e7ebf1">Native states · plugin yields</text>
  <rect x="350" y="132" width="96" height="40" rx="10" fill="#171c24" stroke="#2a313c"/>
  <text x="398" y="158" font-size="13" text-anchor="middle" fill="#e7ebf1">Running</text>
  <rect x="456" y="132" width="96" height="40" rx="10" fill="#171c24" stroke="#2a313c"/>
  <text x="504" y="158" font-size="13" text-anchor="middle" fill="#e7ebf1">Approval</text>
  <rect x="562" y="132" width="96" height="40" rx="10" fill="#171c24" stroke="#2a313c"/>
  <text x="610" y="158" font-size="13" text-anchor="middle" fill="#e7ebf1">Unread</text>
  <text x="350" y="196" font-size="12" fill="#9aa1ac">The hold ring never covers these</text>
  <text x="350" y="216" font-size="12" fill="#9aa1ac">Starting a run clears the hold mark</text>

  <!-- idle -->
  <rect x="110" y="380" width="210" height="96" rx="14" fill="#171c24" stroke="#2a313c" filter="url(#shadow)"/>
  <rect x="112" y="388" width="6" height="80" rx="3" fill="#6ea8ff"/>
  <circle cx="152" cy="428" r="9" fill="#6ea8ff"/>
  <text x="174" y="422" font-size="17" font-weight="600" fill="#e7ebf1">Idle</text>
  <text x="174" y="444" font-size="12" fill="#9aa1ac">blue dot</text>

  <!-- on hold -->
  <rect x="700" y="380" width="210" height="96" rx="14" fill="#171c24" stroke="#2a313c" filter="url(#shadow)"/>
  <rect x="702" y="388" width="6" height="80" rx="3" fill="#e5b567"/>
  <circle cx="742" cy="428" r="8" fill="none" stroke="#8b8f98" stroke-width="3"/>
  <text x="764" y="422" font-size="17" font-weight="600" fill="#e7ebf1">On hold</text>
  <text x="764" y="444" font-size="12" fill="#9aa1ac">hollow grey ring</text>

  <!-- archived -->
  <rect x="400" y="700" width="210" height="96" rx="14" fill="#171c24" stroke="#2a313c" filter="url(#shadow)"/>
  <rect x="402" y="708" width="6" height="80" rx="3" fill="#8b8f98"/>
  <circle cx="442" cy="748" r="9" fill="#8b8f98"/>
  <text x="464" y="742" font-size="17" font-weight="600" fill="#e7ebf1">Archived</text>
  <text x="464" y="764" font-size="12" fill="#9aa1ac">solid grey dot</text>

  <!-- edges -->
  <path d="M 215 380 V 330 H 360 V 250" fill="none" stroke="#6ea8ff" stroke-width="2" marker-end="url(#arrBlue)"/>
  <text x="226" y="318" font-size="12" fill="#6ea8ff" paint-order="stroke" stroke="#0e1116" stroke-width="5">① start running / approval / unread</text>

  <path d="M 470 250 V 360 H 280 V 378" fill="none" stroke="#6ea8ff" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrBlue)"/>
  <text x="300" y="352" font-size="12" fill="#6ea8ff" paint-order="stroke" stroke="#0e1116" stroke-width="5">② finished, no unread / read / approved</text>

  <path d="M 805 380 V 330 H 650 V 250" fill="none" stroke="#6ea8ff" stroke-width="2" marker-end="url(#arrBlue)"/>
  <text x="662" y="318" font-size="12" fill="#6ea8ff" paint-order="stroke" stroke="#0e1116" stroke-width="5">① same, clears the hold mark</text>

  <path d="M 320 410 H 698" fill="none" stroke="#c2c8d2" stroke-width="2" marker-end="url(#arr)"/>
  <text x="404" y="398" font-size="12" fill="#e7ebf1" paint-order="stroke" stroke="#0e1116" stroke-width="5">③ Hold session or ≥5 days quiet</text>

  <path d="M 700 450 H 322" fill="none" stroke="#c2c8d2" stroke-width="2" marker-end="url(#arr)"/>
  <text x="418" y="470" font-size="12" fill="#e7ebf1" paint-order="stroke" stroke="#0e1116" stroke-width="5">④ Resume session</text>

  <path d="M 215 476 V 610 H 442 V 698" fill="none" stroke="#c2c8d2" stroke-width="2" marker-end="url(#arr)"/>
  <text x="228" y="600" font-size="12" fill="#e7ebf1" paint-order="stroke" stroke="#0e1116" stroke-width="5">⑤ Archive</text>

  <path d="M 805 476 V 610 H 572 V 698" fill="none" stroke="#c2c8d2" stroke-width="2" marker-end="url(#arr)"/>
  <text x="818" y="600" font-size="12" fill="#e7ebf1" paint-order="stroke" stroke="#0e1116" stroke-width="5">⑥ Archive (mark kept)</text>

  <path d="M 400 760 H 150 V 478" fill="none" stroke="#8b909a" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrRelease)"/>
  <text x="168" y="748" font-size="12" fill="#9aa1ac" paint-order="stroke" stroke="#0e1116" stroke-width="5">⑦ Unarchive ∧ no mark ∧ &lt;5 days</text>

  <path d="M 610 760 H 860 V 478" fill="none" stroke="#8b909a" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrRelease)"/>
  <text x="600" y="736" font-size="12" fill="#9aa1ac" paint-order="stroke" stroke="#0e1116" stroke-width="5">⑧ Unarchive ∧ (mark ∨ ≥5 days)</text>

  <path d="M 610 790 H 950 V 160 H 672" fill="none" stroke="#8b909a" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrRelease)"/>
  <text x="700" y="148" font-size="12" fill="#9aa1ac" paint-order="stroke" stroke="#0e1116" stroke-width="5">⑨ Unarchive while running / pending / unread</text>

  <rect x="36" y="846" width="928" height="44" rx="10" fill="#151a22" stroke="#2a313c"/>
  <text x="56" y="874" font-size="12" fill="#9aa1ac">solid = user action or activity　dashed = re-evaluated after unarchive　blue = native transitions　grey = hold / archive transitions　①–⑨ = conditions on edges</text>
</svg>
